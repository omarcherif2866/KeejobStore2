    <!--
      Préchargement de l'image LCP identifiée sur la page d'accueil
      (composant home, div.hero-images, 1re image "Team").
      Le chemin est écrit en absolu depuis la racine (grâce à <base href="/">),
      car le chemin relatif "../../../assets/..." du composant ne s'applique pas
      ici dans le <head> global. Ajustez-le si votre dossier "assets" build
      n'est pas exactement à la racine du site déployé.
    -->
    <link
      rel="preload"
      as="image"
      href="/assets/1x/Plan-de-travail-2-01.webp"
      fetchpriority="high"
    />
    <!-- Rappel : renommez idéalement ce fichier sans espaces (plan-de-travail-2-01.webp) -->
