<section class="article-detail-section" *ngIf="article; else notFound">

  <button class="btn-back" (click)="goBack()">
    <span class="arrow">←</span> Retour
  </button>

  <div class="article-detail-layout">

    <!-- Colonne gauche : détail de l'article -->
    <div class="article-detail-card">

      <div class="article-detail-header">
        <div class="article-icon-large" [ngClass]="article.color">
          <svg *ngIf="article.icon === 'file'" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="8" y1="13" x2="16" y2="13"></line>
            <line x1="8" y1="17" x2="16" y2="17"></line>
          </svg>

          <svg *ngIf="article.icon === 'search'" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>

          <svg *ngIf="article.icon === 'target'" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
          </svg>
        </div>

        <div class="article-detail-badge">Marché du travail</div>
      </div>

      <div class="article-detail-body">
        <h1>{{ article.title }}</h1>

        <div class="article-detail-divider"></div>

        <div class="article-detail-description">
          <p *ngFor="let paragraph of article.description.split('\n')">
            {{ paragraph }}
          </p>
        </div>
      </div>

    </div>

    <!-- Colonne droite : autres articles -->
    <aside class="article-sidebar">
      <h3 class="sidebar-title">Autres Marchés</h3>

      <div class="sidebar-list">
        <a
          class="sidebar-item"
          *ngFor="let other of marcheTravail"
          [class.hidden-current]="other.id === article.id"
          [routerLink]="['/marche-travail', other.id]"
        >
          <div class="sidebar-item-icon" [ngClass]="other.color">
            <svg *ngIf="other.icon === 'file'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <svg *ngIf="other.icon === 'search'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <svg *ngIf="other.icon === 'target'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
            </svg>
          </div>

          <div class="sidebar-item-text">
            <h4>{{ other.title }}</h4>
          </div>
        </a>
      </div>
    </aside>

  </div>

</section>

<ng-template #notFound>
  <div class="article-not-found">
    <p>Cet article est introuvable.</p>
    <button class="btn-back" (click)="goBack()">← Retour</button>
  </div>
</ng-template>
