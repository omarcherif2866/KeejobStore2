<section class="expertise-section">
  <div class="platforms-cards-container">

    <div *ngFor="let article of marcheTravail" class="platform-card">

      <!-- HEADER CARD -->
      <div class="platform-header">
        <div class="platform-logo-wrapper" [ngClass]="article.color">
          <svg *ngIf="article.icon === 'file'" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="8" y1="13" x2="16" y2="13"></line>
            <line x1="8" y1="17" x2="16" y2="17"></line>
          </svg>

          <svg *ngIf="article.icon === 'search'" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>

          <svg *ngIf="article.icon === 'target'" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
          </svg>
        </div>

        <h3 class="platform-name">{{ article.title }}</h3>
      </div>

      <!-- DESCRIPTION -->
      <p class="platform-description">{{ article.description }}</p>

      <!-- BUTTON -->
      <a [routerLink]="['/marche-travail', article.id]" class="btn btn-primary">
        En savoir plus
      </a>
    </div>

  </div>
</section>
