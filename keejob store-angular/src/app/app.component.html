<app-top-bar *ngIf="showTopBar"></app-top-bar>

<app-footer *ngIf="showFooter && !isLoading"></app-footer>

  class="scroll-to-top"
  [class.visible]="showScrollTop"

    <line x1="12" y1="19" x2="12" y2="5"></line>
    <polyline points="5 12 12 5 19 12"></polyline>
  </svg>
</button>
