<svg width="400" height="380" viewBox="0 0 400 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F4FD"/>
      <stop offset="100%" stop-color="#E8E9FA"/>
    </linearGradient>
  </defs>

  <!-- Décorations : petits points -->
  <circle cx="60" cy="90" r="4" fill="#C9CCF2"/>
  <circle cx="340" cy="70" r="5" fill="#A7ABE0"/>
  <circle cx="320" cy="260" r="4" fill="#C9CCF2"/>
  <path d="M40 250 l8 8 M40 258 l8 -8" stroke="#A7ABE0" stroke-width="2" stroke-linecap="round"/>
  <path d="M350 180 l8 8 M350 188 l8 -8" stroke="#C9CCF2" stroke-width="2" stroke-linecap="round"/>

  <!-- Croix décorative -->
  <g transform="translate(180,40)">
    <path d="M-8,-8 L8,8 M8,-8 L-8,8" stroke="#7C7EC9" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Pot de fleur -->
  <g transform="translate(70,240)">
    <path d="M0 0 L50 0 L44 40 L6 40 Z" fill="#9497DB"/>
    <path d="M6 40 L44 40 L42 46 L8 46 Z" fill="#7C7EC9"/>
    <!-- tige -->
    <path d="M25 0 C 25 -40, 10 -50, 5 -80" stroke="#A7ABE0" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M25 0 C 25 -50, 45 -55, 55 -90" stroke="#9497DB" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M25 0 C 22 -30, 25 -45, 20 -65" stroke="#7C7EC9" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- feuilles -->
    <ellipse cx="8" cy="-78" rx="12" ry="7" fill="#A7ABE0" transform="rotate(-30 8 -78)"/>
    <ellipse cx="55" cy="-88" rx="12" ry="7" fill="#7C7EC9" transform="rotate(20 55 -88)"/>
    <ellipse cx="18" cy="-63" rx="10" ry="6" fill="#9497DB" transform="rotate(-15 18 -63)"/>
  </g>

  <!-- Carte / document -->
  <g transform="translate(120,80)">
    <rect x="0" y="0" width="160" height="200" rx="14" fill="url(#cardGradient)" stroke="#D4D6F5" stroke-width="2"/>
    <!-- en-tête colorée du document -->
    <rect x="0" y="0" width="160" height="18" rx="14" fill="#7C7EC9"/>
    <rect x="0" y="10" width="160" height="8" fill="#7C7EC9"/>

    <!-- icône rond -->
    <circle cx="30" cy="50" r="12" fill="#C9CCF2"/>

    <!-- lignes de texte -->
    <rect x="52" y="42" width="80" height="6" rx="3" fill="#C9CCF2"/>
    <rect x="52" y="54" width="55" height="6" rx="3" fill="#DBDDF8"/>

    <rect x="20" y="85" width="120" height="6" rx="3" fill="#DBDDF8"/>
    <rect x="20" y="98" width="100" height="6" rx="3" fill="#E4E5FA"/>
    <rect x="20" y="111" width="110" height="6" rx="3" fill="#E4E5FA"/>

    <rect x="20" y="135" width="70" height="6" rx="3" fill="#DBDDF8"/>
    <rect x="20" y="148" width="90" height="6" rx="3" fill="#E4E5FA"/>
    <rect x="20" y="161" width="60" height="6" rx="3" fill="#E4E5FA"/>
  </g>

  <!-- Loupe -->
  <g transform="translate(190,190)">
    <circle cx="40" cy="40" r="38" fill="#EFEFFB" stroke="#5958A0" stroke-width="6"/>
    <circle cx="40" cy="40" r="38" fill="none" stroke="#7C7EC9" stroke-width="2" opacity="0.5"/>
    <rect x="68" y="68" width="16" height="42" rx="8" fill="#5958A0" transform="rotate(45 68 68)"/>
    <!-- reflet -->
    <path d="M20 22 A22 22 0 0 1 44 12" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>
</svg>