# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name marketjob.tn www.marketjob.tn;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    # AVANT : listen 443 ssl;  → HTTP/1.1 uniquement, requêtes en série.
    # APRÈS : http2 permet le multiplexage (toutes les requêtes en
    # parallèle sur une seule connexion) — important vu le nombre
    # de fichiers CSS/JS/polices chargés sur cette page.
    listen 443 ssl http2;
    server_name marketjob.tn www.marketjob.tn;

    ssl_certificate     /etc/letsencrypt/live/marketjob.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketjob.tn/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # --- Compression gzip : ABSENTE avant, ajoutée ici ---
    # Sans ça, ton JS/CSS/HTML partent bruts sur le réseau.
    # C'est très probablement une grosse part du poids total
    # (le rapport Lighthouse "Ancien JavaScript" mesure le JS
    # non-transpilé utile, pas le transfert réseau — mais gzip
    # réduit quand même le temps de téléchargement de tout le JS,
    # ancien ou pas).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/woff
        font/woff2
        font/ttf
        font/eot
        font/otf
        image/svg+xml;

    # --- Cache long pour JS/CSS (fichiers hashés par Angular build) ---
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, immutable";
        expires 1y;
        try_files $uri =404;
    }

    # --- Cache long pour images et fonts ---
    location ~* \.(webp|jpg|jpeg|png|gif|svg|ico|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, immutable";
        expires 1y;
        try_files $uri =404;
    }

    # --- Jamais de cache pour index.html ---
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts to prevent 502
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}